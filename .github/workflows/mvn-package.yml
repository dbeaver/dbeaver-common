name: Maven Verify

on:
  workflow_call:
    inputs:
      project-directory:
        required: false
        type: string
      timeout-minutes:
        required: false
        type: number
        default: 10
      project-deps:
        required: false
        type: string
      mvn-args:
        required: false
        type: string

    outputs:
      run-id:
        value: ${{ jobs.build-and-test.outputs.run-id }}

    secrets:
      DEVOPS_ISSUE_RO_TOKEN:
        required: false

jobs:
  build-and-test:
    name: Build Java
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read

    outputs:
      run-id: ${{ github.run_id }}

    env:
      MAVEN_OPTS: -Xmx2048m

    steps:
      - uses: dbeaver/github-actions/prepare-for-a-maven-lifecycle@dbeaver/dbeaver-devops#1978-cache
        with:
          project-deps: ${{ inputs.project-deps }}
          token: ${{ secrets.DEVOPS_ISSUE_RO_TOKEN }}

      - name: Compile
        run: mvn clean verify -B -T1C ${{ inputs.mvn-args }}
        working-directory: ${{ inputs.project-directory || env.CHECKOUT_PATH || '.' }}
