name: Lint

permissions: {}

on:
  workflow_call:
    inputs:
      common-ref:
        description: DBeaver Common revision containing the lint configuration and scripts
        type: string
        default: ''

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      CHECKSTYLE_VERSION: '14.4.0'
      CHECKSTYLE_SHA256: c0a521e54eabd1ece4ff7bd84cf231b012615745ed3aa4fb27ab0ca73097250c

    steps:
      - name: 'checkstyle: checkout target repository'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A PR merge commit and its parents are sufficient for diff-context filtering.
          fetch-depth: 2
          persist-credentials: false

      - name: 'checkstyle: checkout configuration and scripts'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dbeaver/dbeaver-common
          ref: ${{ inputs.common-ref || (github.repository == 'dbeaver/dbeaver-common' && github.sha) || 'devel' }}
          path: .checkstyle/common
          persist-credentials: false

      - name: 'checkstyle: checkout nullability plugin'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dbeaver/checkstyle-nullability-annotations
          ref: a1c3e402ed99a9698f8fe7bb0440b3aab2a596da
          path: .checkstyle/nullability
          persist-credentials: false

      - name: 'checkstyle: set up Java'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: temurin

      - name: 'checkstyle: download and verify CLI'
        shell: bash
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --connect-timeout 30 \
            "https://github.com/checkstyle/checkstyle/releases/download/checkstyle-${CHECKSTYLE_VERSION}/checkstyle-${CHECKSTYLE_VERSION}-all.jar" \
            --output "$RUNNER_TEMP/checkstyle.jar"
          echo "$CHECKSTYLE_SHA256  $RUNNER_TEMP/checkstyle.jar" | sha256sum --check --strict

      - name: 'checkstyle: build and test nullability plugin'
        run: .checkstyle/common/mvnw -B -ntp package -f .checkstyle/nullability/pom.xml

      - name: 'checkstyle: test CLI integration and reporting'
        env:
          CHECKSTYLE_JAR: ${{ runner.temp }}/checkstyle.jar
          CHECKSTYLE_PLUGIN: ${{ github.workspace }}/.checkstyle/nullability/target/checkstyle-nullability-annotations-latest.jar
        run: python3 -m unittest discover -s .checkstyle/common/.github/checkstyle -p 'test_*.py' -v

      - name: 'checkstyle: analyze and annotate'
        env:
          CHECKSTYLE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 .checkstyle/common/.github/checkstyle/checkstyle.py
          --jar "$RUNNER_TEMP/checkstyle.jar"
          --plugin .checkstyle/nullability/target/checkstyle-nullability-annotations-latest.jar
          --config .checkstyle/common/.github/dbeaver-checkstyle-config.xml
