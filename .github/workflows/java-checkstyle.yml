name: Lint

on:
  # Allows you to reuse workflows by referencing their YAML files
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: 'checkstyle: checkout configuration'
        uses: actions/checkout@v4

      - name: 'checkstyle-nullability-annotations: checkout plugin'
        uses: actions/checkout@v4
        with:
          repository: dbeaver/checkstyle-nullability-annotations
          path: checkstyle-nullability-annotations

      - name: 'checkstyle-nullability-annotations: set up JDK 17'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 'checkstyle-nullability-annotations: build using Maven'
        run: ./mvnw -B package -f checkstyle-nullability-annotations/pom.xml

      - uses: dbeaver/action-java-checkstyle@dbeaver/pro#7071-nullability-annotations-check
        with:
          reporter: github-pr-annotations
          filter_mode: diff_context
          checkstyle_config: ./.github/dbeaver-checkstyle-config.xml
          checkstyle_classpath: ./checkstyle-nullability-annotations/target/checkstyle-nullability-annotations-1.1-SNAPSHOT.jar
          fail_on_error: false
